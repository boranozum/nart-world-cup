name: Deploy → Test

on:
  push:
    branches: [test]

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  deploy:
    name: Trigger Coolify deploy
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment
        # Coolify's /api/v1/deploy endpoint requires a Bearer API token
        # (Keys & Tokens → API tokens, scoped to "deploy").
        run: |
          curl -fsSL "${{ secrets.TEST_COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.TEST_COOLIFY_API_TOKEN }}"
