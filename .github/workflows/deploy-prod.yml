name: Deploy → Prod

on:
  push:
    branches: [prod]

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  deploy:
    name: Trigger Coolify deploy
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment
        # Coolify webhook: Settings → Deployments → Deploy Webhook
        run: curl -fsSL "${{ secrets.PROD_COOLIFY_WEBHOOK }}"
